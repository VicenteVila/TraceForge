[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.1.0"
description = "Trazabilidad estructurada para pipelines multi-agente con LLMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CogniTeam", email = "cogniteam@example.com"},
]
keywords = ["tracing", "llm", "multi-agent", "observability", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.9",
    "jinja2>=3.0",
]

[project.optional-dependencies]
plotly = ["plotly>=5.0"]
otel = [
    "opentelemetry-api>=1.0",
    "opentelemetry-sdk>=1.0",
    "opentelemetry-exporter-otlp>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://traceforge.dev"
Source = "https://github.com/cogniteam/traceforge"
Issues = "https://github.com/cogniteam/traceforge/issues"
Documentation = "https://github.com/cogniteam/traceforge#readme"

[project.scripts]
traceforge = "traceforge.cli:app"

[tool.setuptools.packages.find]
include = ["traceforge", "traceforge.*"]

[tool.setuptools.package-data]
traceforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# HTML template strings can't be cleanly wrapped
"traceforge/report.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["traceforge"]
